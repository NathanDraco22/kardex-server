[project]
name = "kardex-business"
version = "0.1.0"
description = "Business logic and data access layer for Kardex server"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.12.1",
    "pymongo>=4.17.0",
    "pytz>=2026.2",
]

[tool.ty.environment]
extra-paths = [".venv/Lib/site-packages", "./src"]

[tool.uv.sources]
