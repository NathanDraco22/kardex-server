[project]
name = "kardex-server"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.2",
    "fastapi[standard]>=0.135.2",
    "motor>=3.7.1",
    "onnxruntime>=1.24.4",
    "openpyxl>=3.1.5",
    "packaging>=24.2",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.0.1",
    "pytz>=2026.1",
    "scalar-fastapi>=1.8.1",
]

[dependency-groups]
dev = [
    "onion",
    "pytest-asyncio>=0.25.3",
    "pytest>=8.3.5",
    "ruff>=0.9.10",
    "ty>=0.0.31",
]

[tool.uv.sources]
onion = { git = "https://github.com/NathanDraco22/onion-cli.git" }

[tool.ty.environment]
extra-paths = [
    "./app", ".venv/Lib/site-packages"
]
