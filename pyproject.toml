[project]
name = "kardex-server"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=48.0.0",
    "fastapi[standard]>=0.136.1",
    "kardex-business",
    "motor>=3.7.1",
    "onnxruntime>=1.26.0",
    "openpyxl>=3.1.5",
    "packaging>=26.2",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "pytz>=2026.2",
    "scalar-fastapi>=1.8.2",
]

[tool.uv.sources]
kardex-business = { path = "./packages/kardex-business", editable = true }
onion = { git = "https://github.com/NathanDraco22/onion-cli.git" }

[dependency-groups]
dev = [
    "onion",
    "pytest-asyncio>=0.25.3",
    "pytest>=8.3.5",
    "ruff>=0.9.10",
    "ty>=0.0.31",
]

[tool.ty.environment]
extra-paths = [
    "./app", ".venv/Lib/site-packages", "./packages/kardex-business/src"
]
