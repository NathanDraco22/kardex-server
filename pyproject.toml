[project]
name = "kardex-server-lite"
version = "0.1.1"
description = "Kardex Server Lite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.2",
    "fastapi[standard]>=0.130.0",
    "motor>=3.7.1",
    "openpyxl>=3.1.5",
    "orjson>=3.10.15",
    "packaging>=24.2",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.0.1",
    "pytz>=2025.2",
]

[dependency-groups]
dev = [
    "onion",
    "pytest-asyncio>=0.25.3",
    "pytest>=8.3.5",
    "ruff>=0.9.10",
]

[tool.uv.sources]
onion = { git = "https://github.com/NathanDraco22/onion-cli.git" }
